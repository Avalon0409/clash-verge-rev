name: 问题反馈 / Bug report
title: '[BUG] '
description: Report a problem in Clash Verge App Proxy
labels: ['bug']
type: 'Bug'

body:
  - type: markdown
    attributes:
      value: |
        Report the custom client from this repository. Read the [user guide](https://github.com/Avalon0409/clash-verge-rev/blob/main/docs/usage.md) and [FAQ](https://github.com/Avalon0409/clash-verge-rev/blob/main/docs/faq.md), then search [existing reports](https://github.com/Avalon0409/clash-verge-rev/issues).
        Include the installed release tag and actual routing behavior. Remove passwords, sessions and subscription credentials from attachments.
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: Describe the expected behavior and what actually happens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 客户端版本与发行包 / Client version and release tag
      description: Include the app-proxy release tag and bundled core version when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Reproduction
      description: Include application and system proxy modes, selected subscription and node when relevant.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统 / Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 系统版本与架构 / OS version and architecture
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Relevant logs
      description: Open the log directory from settings and include the relevant operation and error after removing private information.
      render: text
