name: 功能请求 / Feature request
title: '[Feature] '
description: Propose a change to Clash Verge App Proxy
labels: ['enhancement']
type: 'Feature'

body:
  - type: markdown
    attributes:
      value: |
        Read the [current guide](https://github.com/Avalon0409/clash-verge-rev/blob/main/docs/usage.md) and search [existing requests](https://github.com/Avalon0409/clash-verge-rev/issues) before proposing a feature for this custom client.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: Explain the current behavior and why it does not meet your needs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 预期行为 / Expected behavior
      description: Describe the behavior you want and any compatibility requirements.
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: 适用系统 / Platforms
      options:
        - label: Windows
        - label: macOS
        - label: Linux
